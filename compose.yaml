services:
  web:
    depends_on:
      db:
        condition: service_healthy
    build: .
    ports: 
      - "5246:5246"
      - "8088:8088"
    networks:
      - services_net
      - db_bridge

  db:
    container_name: carpenter_orders_db
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      #MSSQL_PID: ${MSSQL_PID}:-CSHOP-12345}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-@dm1N123!}"
      SQL_CARPENTER_USER: "${SQL_CARPENTER_USER:-admin}"
      SQL_CARPENTER_PASSWORD: "${SQL_CARPENTER_PASSWORD:-P@ssword}"
    volumes:
      - mssqlsystem:/var/opt/mssql
      - mssqluser:/var/opt/sqlserver
      - ./mssql/:/opt/app/
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    networks:
      - db_bridge
    working_dir: /opt/app
    command: sh -c "/opt/mssql/bin/sqlservr && echo 'Server started' && ./config/entrypoint.sh"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd","-C","-S", "localhost", "-U","sa","-P","${MSSQL_SA_PASSWORD}", "-Q", "select 1"]
      interval: 1s
      retries: 20
    restart: unless-stopped
    

networks:
  services_net:
    external: true
  db_bridge:
    driver: bridge


volumes:
  mssqlsystem:
  mssqluser: